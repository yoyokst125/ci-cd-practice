name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 編譯 hello.c
        run: gcc hello.c -o hello

      - name: 執行 hello
        run: ./hello
